# Goes to /etc/nginx/conf.d/gzip.conf. The stock nginx.conf only has `gzip on;`,
# which compresses HTML alone — JS, CSS and JSON (the bulk of a Next.js page)
# went out raw. next.config.ts sets compress: false because this layer does it.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/json
  application/xml
  application/rss+xml
  application/manifest+json
  image/svg+xml;
