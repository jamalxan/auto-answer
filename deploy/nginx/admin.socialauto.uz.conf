# Goes to /etc/nginx/sites-available/admin-socialauto and is symlinked into
# sites-enabled. After the DNS A record admin.socialauto.uz -> 32.199.91.62
# exists, run:  sudo certbot --nginx -d admin.socialauto.uz
# (certbot adds the 443 server block and the HTTP -> HTTPS redirect).
server {
    listen 80;
    listen [::]:80;
    server_name admin.socialauto.uz;

    # The panel lives under /admin in the app; make the bare host land on it.
    location = / {
        return 302 /admin/login;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
