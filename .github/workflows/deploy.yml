name: Deploy

# Every push to master: check, build the image on GitHub, push it to GHCR and
# roll the server over to it. Needs the repo secrets DEPLOY_HOST and
# DEPLOY_USER plus ONE of:
#   DEPLOY_SSH_KEY   - private key whose public half is in the server's
#                      ~/.ssh/authorized_keys (preferred)
#   DEPLOY_PASSWORD  - the SSH password (fallback; used only while no key is
#                      installed on the server)
# Target: the Azure box 48.217.83.167 (ubuntu 24.04, azureuser, docker group).

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jamalxan/auto-answer

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/socialauto
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build and push image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH (key if present, otherwise password)
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          if [ -n "$KEY" ]; then
            install -m 600 /dev/null ~/.ssh/deploy_key
            printf '%s\n' "$KEY" > ~/.ssh/deploy_key
            SSH="ssh -i $HOME/.ssh/deploy_key $OPTS"
            SCP="scp -i $HOME/.ssh/deploy_key $OPTS"
          elif [ -n "$SSHPASS" ]; then
            sudo apt-get install -y -qq sshpass >/dev/null
            SSH="sshpass -e ssh $OPTS"
            SCP="sshpass -e scp $OPTS"
          else
            echo "Neither DEPLOY_SSH_KEY nor DEPLOY_PASSWORD is set" >&2; exit 1
          fi
          echo "SSH=$SSH" >> "$GITHUB_ENV"
          echo "SCP=$SCP" >> "$GITHUB_ENV"
          $SSH "$USER@$HOST" "echo ssh-ok && docker --version"

      - name: Roll the server over to the new image
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.sha }}
        run: |
          set -e
          $SCP deploy/docker-compose.server.yml "$USER@$HOST:socialauto/docker-compose.server.yml"
          $SCP deploy/nginx/gzip.conf "$USER@$HOST:socialauto/gzip.conf"
          $SCP deploy/nginx/upload.conf "$USER@$HOST:socialauto/upload.conf"

          # The token is passed on stdin so it never shows up in a process list.
          printf '%s' "$GHCR_TOKEN" | $SSH "$USER@$HOST" "docker login ghcr.io -u $GHCR_USER --password-stdin"
          $SSH "$USER@$HOST" "cd socialauto && export APP_TAG=$TAG \
            && docker compose -f docker-compose.server.yml pull web worker cron \
            && docker compose -f docker-compose.server.yml up -d --remove-orphans \
            && echo APP_TAG=$TAG > .deploy-tag \
            && sudo cp gzip.conf /etc/nginx/conf.d/gzip.conf && sudo cp upload.conf /etc/nginx/conf.d/upload.conf && sudo nginx -t && sudo systemctl reload nginx \
            ; status=\$?; docker logout ghcr.io; exit \$status"

      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 30); do
            if $SSH "$USER@$HOST" "curl -fsS http://127.0.0.1:3000/api/health >/dev/null"; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "app did not become healthy" >&2
          $SSH "$USER@$HOST" "docker logs --tail 60 socialauto-web-1" || true
          exit 1

      - name: Remove old images
        if: always()
        run: $SSH "$USER@$HOST" "docker image prune -f" || true
