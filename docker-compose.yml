# SocialAuto — Local Development Services
# Run: docker-compose up -d
#
# POSTGRES_DB is left as "openreply" to match the existing local dev volume —
# renaming it here would not rename the already-initialized database inside
# that volume, only change what a *fresh* volume would be seeded with.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
